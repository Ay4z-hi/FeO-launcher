name: Build Playable FeO Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          override: true

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK and NDK via Command Line
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;25.2.9519653'

      - name: Build APK
        run: cargo apk build --target aarch64-linux-android

      - name: Upload Playable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeO-Launcher-APK
          path: target/cargo-apk/aarch64-linux-android/debug/apk/*.apk
