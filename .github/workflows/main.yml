name: Build Playable FeO Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android SDK and NDK via Command Line
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Build Release APK (aarch64 Vulkan Target)
        run: cargo apk build --release --target aarch64-linux-android

      - name: Upload Playable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeO-Engine-Android-Release
          path: target/release/apk/*.apk
